upstream django {
    # django is the service name in docker-compose
    # Docker's internal DNS resolves it automatically
    server django:8000;
}

server {
    listen 80;
    server_name _;    # accept any hostname or IP

    client_max_body_size 20M;

    # Serve static files directly from volume
    # Much faster than going through Django/Gunicorn
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve media files (user uploads) directly
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Pass all other requests to Gunicorn
    location / {
        proxy_pass http://django;

        # Tell Django the real client IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # Health check endpoint
    location /nginx-health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
